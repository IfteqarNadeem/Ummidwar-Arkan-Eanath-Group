name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Cordova and ImageMagick
        run: |
          npm install -g cordova
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Create Android App
        run: |
          cordova create android-app com.ummidwar.arkan "Ummidwar Arkan Eanath Group"
          cd android-app

          rm -rf www/*
          cp ../index.html www/index.html

          cordova platform add android
          cordova plugin add cordova-plugin-file
          cordova plugin add cordova-plugin-x-socialsharing

      - name: Apply Custom App Icon
        run: |
          BASE="android-app/platforms/android/app/src/main/res"

          mkdir -p "$BASE/mipmap-mdpi"
          mkdir -p "$BASE/mipmap-hdpi"
          mkdir -p "$BASE/mipmap-xhdpi"
          mkdir -p "$BASE/mipmap-xxhdpi"
          mkdir -p "$BASE/mipmap-xxxhdpi"

          convert app_icon.png -resize 48x48 "$BASE/mipmap-mdpi/icon.png"
          convert app_icon.png -resize 72x72 "$BASE/mipmap-hdpi/icon.png"
          convert app_icon.png -resize 96x96 "$BASE/mipmap-xhdpi/icon.png"
          convert app_icon.png -resize 144x144 "$BASE/mipmap-xxhdpi/icon.png"
          convert app_icon.png -resize 192x192 "$BASE/mipmap-xxxhdpi/icon.png"

          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path(
              "android-app/platforms/android/app/src/main/AndroidManifest.xml"
          )

          s = manifest.read_text()

          s = re.sub(
              r'android:icon="[^"]+"',
              'android:icon="@mipmap/icon"',
              s
          )

          if 'android:roundIcon=' in s:
              s = re.sub(
                  r'android:roundIcon="[^"]+"',
                  'android:roundIcon="@mipmap/icon"',
                  s
              )

          manifest.write_text(s)
          PY

      - name: Build APK
        run: |
          cd android-app
          cordova build android --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ummidwar-Arkan-Eanath-Group-APK
          path: android-app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
